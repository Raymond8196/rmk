[keyboard]
name = "Charybdis Gazell"
product_name = "Charybdis Gazell"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "nrf52840"
# USB on central (dongle) for HID output
usb_enable = true

[layout]
rows = 5
cols = 12
layers = 1
keymap = [
    [
        ["Escape", "Kc1", "Kc2", "Kc3", "Kc4", "Kc5", "Kc6", "Kc7", "Kc8", "Kc9", "Kc0", "Backspace"],
        ["Tab", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "Backslash"],
        ["CapsLock", "A", "S", "D", "F", "G", "H", "J", "K", "L", "Semicolon", "Enter"],
        ["LShift", "Z", "X", "C", "V", "B", "N", "M", "Comma", "Dot", "Slash", "RShift"],
        ["No", "Minus", "Equal", "Grave", "No", "No", "Delete", "No", "Quote", "No", "Space", "No"]
    ],
]

[host]
vial_enabled = true

[storage]
enabled = true

[split]
connection = "gazell"

# Central: USB dongle (E104-BT5040U), no key matrix — all keys come from peripherals
[split.central]
rows = 0
cols = 0
row_offset = 0
col_offset = 0
[split.central.matrix]
matrix_type = "normal"

# Left hand (pipe 0)
[[split.peripheral]]
rows = 5
cols = 6
row_offset = 0
col_offset = 0
gazell_pipe = 0
[split.peripheral.matrix]
matrix_type = "normal"
col_pins = ["P0_02", "P0_29", "P0_09", "P1_00", "P0_11", "P1_04"]
row_pins = ["P0_31", "P1_15", "P0_24", "P0_22", "P1_06"]
row2col = true

# Right hand (pipe 1)
[[split.peripheral]]
rows = 5
cols = 6
row_offset = 0
col_offset = 6
gazell_pipe = 1
[split.peripheral.matrix]
matrix_type = "normal"
col_pins = ["P1_04", "P0_11", "P1_00", "P0_09", "P0_17", "P0_02"]
row_pins = ["P0_20", "P1_15", "P0_24", "P0_22", "P1_06"]
row2col = true

# Trackball (PMW3610, right hand)
[[split.peripheral.input_device.pmw3610]]
name = "trackball0"
spi.instance = "bitbang0"
spi.sck = "P0_08"
spi.mosi = "P0_29"
spi.miso = "P0_29"
spi.cs = "P0_31"
motion = "P0_06"
force_awake = false
smart_mode = true
cpi = 600
invert_x = true
invert_y = true
swap_xy = true
